openapi: 3.1.0
info:
  title: SmartStudy API
  version: 0.1.0
  description: Contracts for auth-guarded board workflows and AI assistant grounding.
servers:
  - url: http://localhost:3000
paths:
  /api/boards:
    get:
      summary: List boards for current user
      parameters:
        - in: query
          name: subject
          schema:
            type: string
            enum: [MATH, PHYSICS]
        - in: query
          name: favorite
          schema:
            type: boolean
        - in: query
          name: search
          schema:
            type: string
            maxLength: 120
        - in: query
          name: sort
          schema:
            type: string
            enum: [lastOpened, updatedAt, title]
            default: lastOpened
      responses:
        "200":
          description: Board list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BoardsListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      summary: Create a board
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBoardRequest"
      responses:
        "201":
          description: Board created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Board"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/boards/{boardId}:
    get:
      summary: Get board metadata
      parameters:
        - $ref: "#/components/parameters/BoardId"
      responses:
        "200":
          description: Board metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Board"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      summary: Update board metadata
      parameters:
        - $ref: "#/components/parameters/BoardId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateBoardRequest"
      responses:
        "200":
          description: Board updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Board"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/boards/{boardId}/scene:
    get:
      summary: Get latest board scene snapshot
      parameters:
        - $ref: "#/components/parameters/BoardId"
      responses:
        "200":
          description: Latest scene snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BoardSceneSnapshot"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      summary: Save latest board scene snapshot
      parameters:
        - $ref: "#/components/parameters/BoardId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveSceneRequest"
      responses:
        "200":
          description: Scene saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BoardSceneSnapshot"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/boards/{boardId}/assistant:
    post:
      summary: Ask board-grounded assistant question
      parameters:
        - $ref: "#/components/parameters/BoardId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssistantQuestionRequest"
      responses:
        "200":
          description: Assistant answered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssistantAnswerResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          description: Assistant unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  parameters:
    BoardId:
      in: path
      name: boardId
      required: true
      schema:
        type: string
        format: uuid
  responses:
    Unauthorized:
      description: Not authenticated
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: Authenticated but not allowed to access this board
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    BadRequest:
      description: Validation failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    Board:
      type: object
      required: [id, title, subject, isFavorite, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        subject:
          type: string
          enum: [MATH, PHYSICS]
        isFavorite:
          type: boolean
        lastOpenedAt:
          type: string
          format: date-time
          nullable: true
        updatedAt:
          type: string
          format: date-time
    BoardsListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Board"
    CreateBoardRequest:
      type: object
      required: [title, subject]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 120
        subject:
          type: string
          enum: [MATH, PHYSICS]
    UpdateBoardRequest:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 120
        subject:
          type: string
          enum: [MATH, PHYSICS]
        isFavorite:
          type: boolean
    BoardSceneSnapshot:
      type: object
      required: [boardId, sceneVersion, elementsJson, appStateJson, createdAt]
      properties:
        boardId:
          type: string
          format: uuid
        sceneVersion:
          type: integer
          minimum: 1
        elementsJson:
          type: array
          items:
            type: object
            additionalProperties: true
        appStateJson:
          type: object
          additionalProperties: true
        filesJson:
          type: object
          additionalProperties: true
          nullable: true
        createdAt:
          type: string
          format: date-time
    SaveSceneRequest:
      type: object
      required: [elementsJson, appStateJson]
      properties:
        elementsJson:
          type: array
          items:
            type: object
            additionalProperties: true
        appStateJson:
          type: object
          additionalProperties: true
        filesJson:
          type: object
          additionalProperties: true
          nullable: true
    AssistantQuestionRequest:
      type: object
      required: [questionText]
      properties:
        questionText:
          type: string
          minLength: 1
          maxLength: 4000
    AssistantAnswerResponse:
      type: object
      required: [questionId, status]
      properties:
        questionId:
          type: string
          format: uuid
        status:
          type: string
          enum: [ANSWERED, FAILED]
        assistantAnswerText:
          type: string
          nullable: true
        failureReason:
          type: string
          nullable: true
    ErrorResponse:
      type: object
      required: [message]
      properties:
        message:
          type: string
        code:
          type: string
